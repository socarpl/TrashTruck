name: Build and release TrashTruck

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

# Keep release updates sequential so two builds cannot replace assets at once.
concurrency:
  group: trashtruck-latest-release
  cancel-in-progress: false

jobs:
  release:
    # Publish only the repository's default branch, including manual runs.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Set CI build number
        run: |
          # The project increments this value once during publish.
          # CI runs need no counter commit, and reruns retain their version.
          $baseNumber = [int](Get-Content -LiteralPath BuildNumber.txt -Raw).Trim()
          $nextNumber = $baseNumber + [int]$env:GITHUB_RUN_NUMBER
          if ($nextNumber -lt 1 -or $nextNumber -gt 65534) {
            throw 'Build number exhausted. Increase VersionPrefix and reset the build sequence.'
          }
          Set-Content -LiteralPath BuildNumber.txt -Value ($nextNumber - 1) -Encoding ascii

      - name: Publish Windows x64 Native AOT executable
        run: |
          dotnet publish TrashTruck.csproj -c Release -r win-x64 --self-contained true -p:PublishAot=true -o artifacts/win-x64
          if ($LASTEXITCODE -ne 0) { throw 'Native AOT publish failed.' }

      - name: Verify native executable and version
        id: verify
        run: |
          $exePath = (Resolve-Path -LiteralPath artifacts/win-x64/TrashTruck.exe).Path
          $version = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exePath).FileVersion
          $versionOutput = & $exePath --version
          if ($LASTEXITCODE -ne 0 -or $versionOutput -ne "TrashTruck $version") {
            throw 'Published executable version does not match its file version.'
          }
          $helpOutput = & $exePath --help
          if ($LASTEXITCODE -ne 0 -or ($helpOutput -join "`n") -notmatch '--quiet') {
            throw 'Published executable help check failed.'
          }

          # A native x64 PE must have no CLR runtime header.
          $reader = [System.IO.BinaryReader]::new([System.IO.File]::OpenRead($exePath))
          try {
            $reader.BaseStream.Position = 0x3c
            $peOffset = $reader.ReadInt32()
            $reader.BaseStream.Position = $peOffset
            if ($reader.ReadUInt32() -ne 0x00004550) { throw 'Invalid PE signature.' }
            if ($reader.ReadUInt16() -ne 0x8664) { throw 'Expected Windows x64 executable.' }
            $reader.BaseStream.Position = $peOffset + 24
            if ($reader.ReadUInt16() -ne 0x20b) { throw 'Expected PE32+ format.' }
            $reader.BaseStream.Position = $peOffset + 24 + 112 + (14 * 8)
            if ($reader.ReadUInt32() -ne 0 -or $reader.ReadUInt32() -ne 0) {
              throw 'Executable contains a managed CLR header; Native AOT was not produced.'
            }
          } finally {
            $reader.Dispose()
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Output "Verified standalone Native AOT executable: TrashTruck $version"

      - name: Update the single download release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APP_VERSION: ${{ steps.verify.outputs.version }}
        run: |
          $title = "TrashTruck $env:APP_VERSION (Windows x64)"
          $notesPath = Join-Path $env:RUNNER_TEMP 'trashtruck-release-notes.md'
          $notes = @(
            "TrashTruck $env:APP_VERSION for Windows x64.",
            '',
            'Download **TrashTruck.exe** below. No .NET Framework or .NET runtime installation is required.',
            'Run `TrashTruck.exe --help` for usage.',
            '',
            'This release is updated automatically; only the current build is kept here.',
            "Source commit: $env:GITHUB_SHA",
            "Build: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          )
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding utf8

          gh release view latest --json id 2>$null
          $releaseExists = $LASTEXITCODE -eq 0
          if ($releaseExists) {
            gh release upload latest artifacts/win-x64/TrashTruck.exe --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed.' }
            gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/git/refs/tags/latest" -f "sha=$env:GITHUB_SHA" -F force=true
            if ($LASTEXITCODE -ne 0) { throw 'Updating the latest tag failed.' }
            gh release edit latest --title $title --notes-file $notesPath --latest
            if ($LASTEXITCODE -ne 0) { throw 'Release update failed.' }
          } else {
            gh release create latest artifacts/win-x64/TrashTruck.exe --target $env:GITHUB_SHA --title $title --notes-file $notesPath --latest
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
          }
          "Download: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/releases/latest/download/TrashTruck.exe" >> $env:GITHUB_STEP_SUMMARY
